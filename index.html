<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2B3A67">
<title>IJMB Student Hub</title>
<meta name="description" content="A study companion for IJMB examination preparation — practice CBT quizzes, study materials, timetable and progress tracking.">

<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">
  <!-- The app shell (topbar / sidebar / bottom nav) is built by
       js/app.js -> buildShell() so the same nav config drives both
       layouts. This inline loading state shows only for an instant
       before JavaScript runs. -->
  <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Space Grotesk',sans-serif;color:#2B3A67;">
    Loading IJMB Student Hub…
  </div>
</div>

<noscript>
  <div style="padding:24px;font-family:sans-serif;max-width:520px;margin:40px auto;text-align:center;">
    <h2>JavaScript required</h2>
    <p>IJMB Student Hub runs entirely in your browser and needs JavaScript enabled to work. Please enable JavaScript and reload this page.</p>
  </div>
</noscript>

<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
</body>
</html>
